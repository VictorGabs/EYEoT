<mat-accordion>

  <mat-expansion-panel>

    <mat-expansion-panel-header>
      <mat-panel-title>
        Filtros
      </mat-panel-title>
    </mat-expansion-panel-header>

    <form
      class="filters"
      [formGroup]="form"
      (ngSubmit)="aplicarFiltro()">

      <mat-form-field appearance="outline">

        <mat-icon matPrefix>
          search
        </mat-icon>

        <input
          matInput
          formControlName="busca"
          placeholder="Buscar tipos de sensores por descrição ou unidade de medida ou quantidade física">

      </mat-form-field>



      <div class="filter-actions">

        <button
          matButton
          type="button"
          class="btn-clear"
          (click)="limparFiltros()">

          <mat-icon>clear</mat-icon>
          Limpar filtros

        </button>

        <button
          matButton
          type="submit"
          class="btn-apply">

          <mat-icon>filter_alt</mat-icon>
          Aplicar filtros

        </button>

      </div>

    </form>

  </mat-expansion-panel>

</mat-accordion>
