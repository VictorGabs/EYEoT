<h2 mat-dialog-title>Novo Domínio</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <div class="grid">
      <mat-form-field appearance="outline">
        <mat-label>Nome do domínio</mat-label>
        <input matInput formControlName="domainName" [errorStateMatcher]="matcher">
        @if(form.get('domainName')?.hasError('required')){
          <mat-error>
            Nome do domínio é obrigatório!
          </mat-error>
        }
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Descrição</mat-label>
         <textarea rows="4" matInput formControlName="description"></textarea>
        @if(form.get('description')?.hasError('required')){
          <mat-error>
           Descrição é obrigatório!
          </mat-error>
        }
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close> Cancelar</button>
  <button mat-flat-button color="primary" (click)="salvar()">Salvar</button>
</mat-dialog-actions>
