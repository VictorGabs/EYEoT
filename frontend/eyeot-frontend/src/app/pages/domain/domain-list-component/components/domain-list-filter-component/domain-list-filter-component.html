<mat-accordion>
  <mat-expansion-panel (opened)="panelOpenState.set(true)" (closed)="panelOpenState.set(false)">
    <mat-expansion-panel-header>
      <mat-panel-title> Filtros</mat-panel-title>
    </mat-expansion-panel-header>
    <form class="filters" [formGroup]="form" (ngSubmit)="aplicarFiltro()">


        <mat-form-field appearance="outline">
            <mat-icon matPrefix>search</mat-icon>

            <input matInput formControlName="busca" placeholder="Buscar projeto por nome, número, cliente ou descrição">
        </mat-form-field>

      <div class="filter-actions">

        <button
          matButton
          type="button"
          class="btn-clear"
          (click)="limparFiltros()">

          <mat-icon>clear</mat-icon>
          <span>Limpar filtros</span>

        </button>

        <button
          matButton
          class="btn-apply"
          color="primary"
          type="submit">
          <mat-icon>filter_alt</mat-icon>
          <span>Aplicar filtros</span>
        </button>
      </div>

    </form>
  </mat-expansion-panel>
</mat-accordion>
