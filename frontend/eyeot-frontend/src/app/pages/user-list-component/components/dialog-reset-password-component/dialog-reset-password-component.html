
<div class="success-dialog">

  <div class="success-icon">
    <mat-icon>lock_reset</mat-icon>
  </div>

  <h2 mat-dialog-title>
    Senha redefinida com sucesso!
  </h2>

  <mat-dialog-content>

    <p class="description">
      Uma nova senha foi gerada para o usuário
      <strong>{{ data.usuarioName }}</strong>.
    </p>

    <div class="device-id-box">

      <span class="device-id-label">
        Nova senha
      </span>

      <div class="device-id-value">

        <span>{{ data.novaSenha }}</span>

        <button
          mat-icon-button
          type="button"
          aria-label="Copiar nova senha"
          matTooltip="Copiar senha"
          (click)="copiarSenha()"
        >
          <mat-icon>
            {{ copiado ? 'check' : 'content_copy' }}
          </mat-icon>
        </button>

      </div>

    </div>

    <p class="hint">
      Copie essa senha e repasse-a ao usuário.
      Por segurança, ela não será exibida novamente.
    </p>

  </mat-dialog-content>

  <mat-dialog-actions align="end">

    <button
      matButton
      class="btn-confirm"
      type="button"
      (click)="fechar()"
    >
      Entendi
    </button>

  </mat-dialog-actions>

</div>
