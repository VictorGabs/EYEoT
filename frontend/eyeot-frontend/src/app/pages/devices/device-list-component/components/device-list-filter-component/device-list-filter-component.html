<mat-accordion>

  <mat-expansion-panel>

    <mat-expansion-panel-header>
      <mat-panel-title>
        Filtros
      </mat-panel-title>
    </mat-expansion-panel-header>

    <form
      class="filters"
      [formGroup]="form"
      (ngSubmit)="aplicarFiltro()">

      <mat-form-field appearance="outline">

        <mat-icon matPrefix>
          search
        </mat-icon>

        <input
          matInput
          formControlName="busca"
          placeholder="Buscar dispositivo">

      </mat-form-field>


      <mat-form-field appearance="outline">

        <mat-label>Domínio</mat-label>

        <mat-select formControlName="domain">

          <mat-option [value]="null">
            Todos
          </mat-option>

          @for (domain of domains(); track domain.id_domain) {

            <mat-option [value]="domain.id_domain">
              {{ domain.domainName }}
            </mat-option>

          }

        </mat-select>

      </mat-form-field>


      <div class="filter-actions">

        <button
          matButton
          type="button"
          class="btn-clear"
          (click)="limparFiltros()">

          <mat-icon>clear</mat-icon>
          Limpar filtros

        </button>

        <button
          matButton
          type="submit"
          class="btn-apply">

          <mat-icon>filter_alt</mat-icon>
          Aplicar filtros

        </button>

      </div>

    </form>

  </mat-expansion-panel>

</mat-accordion>
