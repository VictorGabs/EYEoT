<h2 mat-dialog-title>
  Editar Dispositivo
</h2>

<mat-dialog-content>

  <form
    class="device-form"
    [formGroup]="form">

    <mat-form-field appearance="outline">

      <mat-label>Domínio</mat-label>

      <mat-select formControlName="id_domain">

        @for (
          domain of domains();
          track domain.id_domain
        ) {

          <mat-option
            [value]="domain.id_domain">

            {{ domain.domainName }}

          </mat-option>

        }

      </mat-select>

    </mat-form-field>


    <mat-form-field appearance="outline">

      <mat-label>Latitude</mat-label>

      <input
        matInput
        type="number"
        formControlName="latitude">

    </mat-form-field>


    <mat-form-field appearance="outline">

      <mat-label>Longitude</mat-label>

      <input
        matInput
        type="number"
        formControlName="longitude">

    </mat-form-field>


    <mat-form-field appearance="outline">

      <mat-label>Altitude</mat-label>

      <input
        matInput
        type="number"
        formControlName="altitude">

    </mat-form-field>


    <mat-slide-toggle
      formControlName="enable">

      Dispositivo ativo

    </mat-slide-toggle>

  </form>

</mat-dialog-content>


<mat-dialog-actions align="end">

  <button
    mat-button
    mat-dialog-close>

    Cancelar

  </button>

  <button
    matButton
    class="btn-save"
    (click)="salvar()">

    <mat-icon>save</mat-icon>
    Salvar

  </button>

</mat-dialog-actions>
